name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petrol_pump_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/petrol_pump_os?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/petrol_pump_os?schema=public"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      # The CI Postgres service is a plain postgres:16-alpine container, not
      # Supabase, so it lacks the `anon`/`authenticated` roles that Supabase
      # provisions automatically on every project. Migration
      # 20260730150329_enable_rls_deny_by_default (already applied against
      # the real Supabase DB) revokes grants from those roles, so create
      # NOLOGIN stand-ins here purely so that migration can apply in CI too.
      - name: Create Supabase-equivalent roles for RLS migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d petrol_pump_os -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN NOINHERIT;
            END IF;
          END
          $$;
          SQL

      - name: Run migrations against test DB
        run: npx prisma migrate deploy

      # Uncomment once each app has tests/lint configured:
      # - name: Lint
      #   run: npm run lint --workspaces --if-present
      # - name: Test
      #   run: npm run test --workspaces --if-present
